server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router - sab routes index.html pe bhejo
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls backend pe forward karo
    location /api {
        proxy_pass http://taskapp-backend-svc:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
