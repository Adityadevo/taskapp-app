name: CI - Build and Push

on:
  push:
    branches: [ main ]

jobs:

  # ─── BACKEND JOB ───────────────────────────────
  build-backend:
    runs-on: ubuntu-latest

    # Sirf backend folder change hone pe chalega
    if: ${{ github.event_name == 'push' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 2

    - name: Check backend changes
      id: backend-check
      run: |
        if git diff --name-only HEAD~1 HEAD | grep -q "^backend/"; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: DockerHub Login
      if: steps.backend-check.outputs.changed == 'true'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Backend image build & push
      if: steps.backend-check.outputs.changed == 'true'
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/taskapp-backend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/taskapp-backend:${{ github.sha }}

    - name: Update backend tag in infra repo
      if: steps.backend-check.outputs.changed == 'true'
      run: |
        git clone https://x-access-token:${{ secrets.INFRA_REPO_TOKEN }}@github.com/Adityadevo/taskapp-infra.git
        cd taskapp-infra
        sed -i "s|image: ${{ secrets.DOCKERHUB_USERNAME }}/taskapp-backend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/taskapp-backend:${{ github.sha }}|g" k8s/backend-deployment.yaml
        git config user.email "ci@github.com"
        git config user.name "GitHub Actions"
        git add k8s/backend-deployment.yaml
        git commit -m "Update backend image to ${{ github.sha }}" || echo "No changes"
        git push

    - name: Backend skipped
      if: steps.backend-check.outputs.changed == 'false'
      run: echo "⏭️ No backend changes - skipping build"

  # ─── FRONTEND JOB ──────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'push' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 2

    - name: Check frontend changes
      id: frontend-check
      run: |
        if git diff --name-only HEAD~1 HEAD | grep -q "^frontend/"; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: DockerHub Login
      if: steps.frontend-check.outputs.changed == 'true'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Frontend image build & push
      if: steps.frontend-check.outputs.changed == 'true'
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/taskapp-frontend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/taskapp-frontend:${{ github.sha }}

    - name: Update frontend tag in infra repo
      if: steps.frontend-check.outputs.changed == 'true'
      run: |
        git clone https://x-access-token:${{ secrets.INFRA_REPO_TOKEN }}@github.com/Adityadevo/taskapp-infra.git
        cd taskapp-infra
        sed -i "s|image: ${{ secrets.DOCKERHUB_USERNAME }}/taskapp-frontend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/taskapp-frontend:${{ github.sha }}|g" k8s/frontend-deployment.yaml
        git config user.email "ci@github.com"
        git config user.name "GitHub Actions"
        git add k8s/frontend-deployment.yaml
        git commit -m "Update frontend image to ${{ github.sha }}" || echo "No changes"
        git push

    - name: Frontend skipped
      if: steps.frontend-check.outputs.changed == 'false'
      run: echo "⏭️ No frontend changes - skipping build"